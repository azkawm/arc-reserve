# Host nginx vhost for the ArcReserve backend demo API (arc-reserve-backend.talentor.tech).
#
# This is the PRE-certbot state: HTTP only, reverse-proxying to the Docker container's host
# port. Install once (see docs/DEPLOY_BACKEND.md for the full walkthrough):
#
#   sudo cp backend/deploy/nginx.arc-reserve-backend.talentor.tech.conf \
#     /etc/nginx/sites-available/arc-reserve-backend.talentor.tech
#   sudo ln -s /etc/nginx/sites-available/arc-reserve-backend.talentor.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arc-reserve-backend.talentor.tech
#
# `certbot --nginx` rewrites this file in place afterwards to add the 301-to-https redirect and
# the 443 ssl server block (matching this host's other certbot-managed sites) -- don't hand-write
# the SSL block yourself; let certbot own it, including renewal. This requires DNS for the domain
# to already resolve to this host, or certbot's HTTP-01 challenge cannot reach it.

server {
    listen 80;
    listen [::]:80;
    server_name arc-reserve-backend.talentor.tech;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
