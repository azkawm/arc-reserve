server {
  # 8080 so the container can run unprivileged.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Container-local only; not an application health signal.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Vite emits content-hashed asset filenames, so they are safe to cache immutably.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached: a stale shell would load deleted asset hashes.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Single-page app: unknown paths are client routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
