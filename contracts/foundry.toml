[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
# D-027: pinned to what Hedera testnet supports (Besu is Cancun-configured as of release 0.50;
# docs.hedera.com "Deploying Smart Contracts"). Matches today's Foundry default for 0.8.24, so
# bytecode is unchanged; the pin only stops a future Foundry default from breaking the Hedera path.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  # Canonical Uniswap v3-core artifact, vendored from the v3-core 1.0.1 npm package. Its pool init
  # code hash is the mainnet constant e34f199b..., so this is the real AMM, not a recompile.
  # Read by test/local (in-process) and by script/DeployUniswapFactory (chains with no Uniswap).
  { access = "read", path = "./vendor" }
]
# Fork tests hit a real RPC and take seconds-to-minutes each, against ~3s for the whole mock suite.
# They are excluded here so `forge test` stays fast, and run deliberately:
#   FOUNDRY_PROFILE=fork forge test
# `test/local/**` is NOT excluded: it runs real Uniswap too, but deploys it from the vendored
# artifact, so it needs no RPC and belongs in the default run.
no_match_path = "test/fork/**"

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

# Only the fork tests. Inherits everything above, then re-points the path filters.
[profile.fork]
match_path = "test/fork/**"
no_match_path = "test/__none__"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[invariant]
runs = 128
depth = 32
fail_on_revert = false
