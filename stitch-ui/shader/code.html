<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_11 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_11" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_11');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Simplex-inspired procedural flow for futuristic clean infrastructure & liquidity
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187,  // (3.0-sqrt(3.0))/6.0
                      0.366025403784439,  // 0.5*(sqrt(3.0)-1.0)
                     -0.577350269189626,  // -1.0 + 2.0 * C.x
                      0.024390243902439); // 1.0 / 41.0
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
        + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    // Interactive mouse influence
    vec2 mouseNorm = (u_mouse.xy / u_resolution.xy) - 0.5;
    p += mouseNorm * 0.15;
    
    float t = u_time * 0.22;
    
    // Layered institutional fluid waves + kinetic mesh grid
    float n1 = snoise(p * 1.8 + vec2(t * 0.4, -t * 0.3));
    float n2 = snoise(p * 3.6 - vec2(t * 0.2, t * 0.5) + vec2(n1 * 0.6));
    float n3 = snoise(p * 6.2 + vec2(n2 * 0.4, t * 0.3));
    
    // Contour topology lines (inspired by solar irradiance & elevation contours)
    float contour = sin((p.y * 12.0 + n1 * 3.5 + n2 * 1.8) * 3.14159);
    float lines = smoothstep(0.88, 0.96, abs(contour));
    
    // Subtle digital mesh grid
    vec2 gridUV = fract(p * 8.0);
    float grid = (step(0.97, gridUV.x) + step(0.97, gridUV.y)) * 0.06;

    // Design System Color Palette:
    // Parchment base: #fefffc -> rgb(0.996, 1.0, 0.988)
    // Signal Blue accent: #41a1cf -> rgb(0.255, 0.631, 0.812)
    // Cerulean vivid: #0081c0 -> rgb(0.0, 0.506, 0.753)
    // Dusk / Indigo: #1f1f29 -> rgb(0.122, 0.122, 0.161)
    // Solar Auroral Amber hint: rgb(0.96, 0.78, 0.45)
    
    vec3 colParchment = vec3(0.996, 1.0, 0.988);
    vec3 colSignalBlue = vec3(0.255, 0.631, 0.812);
    vec3 colCerulean = vec3(0.02, 0.45, 0.72);
    vec3 colSolarGlow = vec3(0.98, 0.75, 0.42);
    vec3 colDeepSlate = vec3(0.12, 0.14, 0.22);
    
    // Radial soft vignette focusing light at hero center-right
    float radial = length(p - vec2(0.35, -0.1));
    float aura = exp(-radial * 1.6);
    
    // Harmonic color blending
    vec3 bg = colParchment;
    
    // Wave glow with vivid cerulean & signal blue
    float waveGlow = smoothstep(-0.4, 0.8, n1 + n2 * 0.6);
    bg = mix(bg, colSignalBlue * 1.15, waveGlow * 0.38 * aura);
    bg = mix(bg, colCerulean * 1.25, smoothstep(0.2, 0.9, n2) * 0.42 * aura);
    
    // Solar warm highlight stream running through the fluid current
    float solarStream = smoothstep(0.3, 0.8, n3) * smoothstep(-0.2, 0.6, n1);
    bg = mix(bg, colSolarGlow, solarStream * 0.32);
    
    // Add technical kinetic contour topology
    bg = mix(bg, colDeepSlate, lines * 0.22);
    bg += vec3(grid) * colSignalBlue;
    
    // Edge vignette to smoothly fade into parchment background
    float edgeVignette = smoothstep(1.3, 0.2, length(uv - 0.5));
    bg = mix(colParchment, bg, edgeVignette);

    gl_FragColor = vec4(bg, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_11 -->


</body></html>
